name: openwrt-25.12-gcc15-Public

on: workflow_dispatch

jobs:
  build:
    name: ${{ matrix.model }}-${{ matrix.libc }}-${{ matrix.tools }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        model:
          # - nanopi-r5s
          - x86_64
        tag:
          - type: rc2
            version: openwrt-25.12
            release: v25.12.4
        libc:
          - musl
        tools:
          - ccache
          - noccache

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Set time zone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: Show system
      run: |
        lscpu
        free -h
        df -Th
        uname -a

    - name: Set release env
      run: |
        sudo mkdir -p /builder
        sudo chown -R runner.runner /builder
        echo WORKDIR="/builder" >> "$GITHUB_ENV"
        git config --global user.name 'actions'
        git config --global user.email 'action@github.com'

    - name: Free disk space
      uses: sbwml/actions@free-disk
      with:
        build-mount-path: /builder

    - name: Build System Setup
      uses: sbwml/actions@openwrt-build-setup

    - name: Install LLVM
      uses: sbwml/actions@install-llvm

    - name: Compile Toolchain
      working-directory: /builder
      env:
        git_name: grandway2025
        git_password: ${{ secrets.CLONE_TOKEN }}
      run: |
        [ "${{ matrix.libc }}" = "glibc" ] && export ENABLE_GLIBC=y || true
        [ "${{ matrix.tools }}" = "ccache" ] && export ENABLE_CCACHE=y || true
        BUILD_SH_URL="https://raw.githubusercontent.com/grandway2025/Build-OpenWrt/master/openwrt/build.sh"
        curl -fsSL "$BUILD_SH_URL" -o build.sh
        chmod +x build.sh
        bash -n build.sh
        BUILD_TOOLCHAIN=y ENABLE_LTO=y ENABLE_BPF=y USE_GCC15=y ENABLE_MOLD=y bash ./build.sh ${{ matrix.tag.type }} ${{ matrix.model }}
        
    - name: Create release
      uses: ncipollo/release-action@main
      with:
        name: ${{ matrix.tag.version }}
        allowUpdates: true
        tag: ${{ matrix.tag.version }}
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.WORKDIR }}/openwrt/toolchain-cache/*
